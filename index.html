<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片编辑器 v1.2.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 0, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.95);
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(255, 0, 255, 0.3),
                0 0 60px rgba(0, 255, 255, 0.2),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 0, 255, 0.3);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { border-color: rgba(255, 0, 255, 0.3); }
            50% { border-color: rgba(0, 255, 255, 0.5); }
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.2), transparent);
            animation: scanline 3s ease-in-out infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 
                0 0 10px rgba(255, 0, 255, 0.8),
                0 0 20px rgba(255, 0, 255, 0.6),
                0 0 30px rgba(255, 0, 255, 0.4);
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.6); }
            50% { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.6); }
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .main-content {
            padding: 30px;
        }

        .upload-section {
            border: 3px dashed rgba(255, 0, 255, 0.5);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 0, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .upload-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 0, 255, 0.1), transparent);
            transform: translateX(-100%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .upload-section:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .upload-section.dragover {
            background: rgba(255, 0, 255, 0.15);
            border-color: #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
        }

        .upload-icon {
            font-size: 60px;
            color: #ff00ff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .upload-text {
            font-size: 1.2em;
            color: #00ffff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .upload-hint {
            font-size: 0.9em;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        .editor-section {
            display: none;
        }

        .editor-section.active {
            display: block;
        }

        .preview-container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .image-preview {
            flex: 1;
            min-width: 300px;
            background: rgba(20, 20, 30, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255, 0, 255, 0.3);
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .image-preview:hover {
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .image-preview h3 {
            margin-bottom: 15px;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }

        .image-preview canvas {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-preview canvas:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .image-preview.drag-over {
            background: #e8eaff;
            border: 3px dashed #667eea;
        }

        .image-info {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-panel {
            background: rgba(20, 20, 30, 0.9);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff00ff, #00ffff, transparent);
            animation: panelGlow 3s linear infinite;
        }

        @keyframes panelGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .control-panel h3 {
            margin-bottom: 20px;
            color: #ff00ff;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
            font-size: 1.3em;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .control-group input[type="number"],
        .control-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            border-radius: 8px;
            background: rgba(20, 20, 30, 0.8);
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .control-group input[type="number"]:focus,
        .control-group input[type="text"]:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 0, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff00ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
            transition: all 0.3s ease;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 1);
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff00ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
            border: none;
            transition: all 0.3s ease;
        }

        .control-group input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 1);
        }

        .control-group input[type="number"],
        .control-group input[type="range"],
        .control-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e8eaff;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .control-group input[type="number"]:focus,
        .control-group input[type="range"]:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .control-group input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #e8eaff;
            border-radius: 4px;
            padding: 0;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        .range-value {
            display: inline-block;
            margin-left: 10px;
            font-weight: 600;
            color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid rgba(255, 0, 255, 0.5);
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 255, 0.1);
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: rgba(255, 0, 255, 0.2);
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.8),
                0 0 40px rgba(255, 0, 255, 0.4);
            background: rgba(255, 0, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.5);
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.6),
                0 0 40px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-success {
            background: rgba(0, 255, 0, 0.2);
            border-color: #00ff00;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .btn-success:hover {
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.8),
                0 0 40px rgba(0, 255, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .format-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .format-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            background: rgba(20, 20, 30, 0.8);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #ff00ff;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }

        .format-btn:hover {
            background: rgba(255, 0, 255, 0.2);
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        .format-btn.active {
            background: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            animation: formatPulse 2s ease-in-out infinite;
        }

        @keyframes formatPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.8); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 255, 1); }
        }

        .crop-preview {
            position: relative;
            display: inline-block;
            margin-top: 15px;
        }

        .crop-box {
            position: absolute;
            border: 2px dashed #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            cursor: move;
        }

        .crop-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            border-radius: 50%;
        }

        .crop-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .crop-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .crop-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #28a745;
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .file-info p {
            margin: 5px 0;
            color: #856404;
        }

        @media (max-width: 768px) {
            .preview-container {
                flex-direction: column;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ 图片编辑器 <span style="font-size: 0.4em; opacity: 0.8;">v1.2.1</span></h1>
            <p>支持裁剪、压缩、SVG和GIF转换</p>
        </div>

        <div class="main-content">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽图片到此处上传</div>
                <div class="upload-hint">支持 JPG、PNG、GIF、SVG 格式</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="editor-section" id="editorSection">
                <div class="file-info" id="fileInfo"></div>

                <div class="preview-container">
                    <div class="image-preview" id="originalPreview">
                        <h3>原始图片 (点击或拖拽替换)</h3>
                        <canvas id="originalCanvas"></canvas>
                        <div class="image-info" id="originalInfo"></div>
                    </div>
                    <div class="image-preview">
                        <h3>编辑后图片</h3>
                        <canvas id="editedCanvas"></canvas>
                        <div class="image-info" id="editedInfo"></div>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-panel">
                        <h3>✂️ 裁剪设置</h3>
                        <div class="control-group">
                            <label>宽度 (px)</label>
                            <input type="number" id="cropWidth" min="1" placeholder="输入宽度">
                        </div>
                        <div class="control-group">
                            <label>高度 (px)</label>
                            <input type="number" id="cropHeight" min="1" placeholder="输入高度">
                        </div>
                        <div class="control-group">
                            <label>裁剪位置</label>
                            <select id="cropPosition">
                                <option value="center">居中裁剪</option>
                                <option value="top-left">左上角</option>
                                <option value="top-right">右上角</option>
                                <option value="bottom-left">左下角</option>
                                <option value="bottom-right">右下角</option>
                            </select>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="cropBtn">应用裁剪</button>
                            <button class="btn btn-secondary" id="resetCropBtn">重置</button>
                        </div>
                    </div>

                    <div class="control-panel">
                        <h3>🗜️ 压缩设置</h3>
                        <div class="control-group">
                            <label>质量: <span class="range-value" id="qualityValue">80</span>%</label>
                            <input type="range" id="qualitySlider" min="1" max="100" value="80">
                            <small style="color: #999; font-size: 0.85em; display: block; margin-top: 5px;" id="qualityHint">适用于 JPEG 和 WebP 格式</small>
                        </div>
                        <div class="control-group">
                            <label>预估压缩后大小: <span class="range-value" id="compressedSize">-</span></label>
                        </div>
                        <div class="control-group">
                            <label>压缩比: <span class="range-value" id="compressionRatio">-</span></label>
                        </div>
                        <div class="control-group">
                            <label>最大宽度 (px)</label>
                            <input type="number" id="maxWidth" min="1" placeholder="可选">
                        </div>
                        <div class="control-group">
                            <label>最大高度 (px)</label>
                            <input type="number" id="maxHeight" min="1" placeholder="可选">
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="compressBtn">应用压缩</button>
                            <button class="btn btn-secondary" id="resetCompressBtn">重置</button>
                        </div>
                    </div>

                    <div class="control-panel">
                        <h3>🔄 格式转换</h3>
                        <div class="control-group">
                            <label>选择输出格式</label>
                            <div class="format-buttons">
                                <button class="format-btn active" data-format="png">PNG</button>
                                <button class="format-btn" data-format="jpeg">JPEG</button>
                                <button class="format-btn" data-format="webp">WebP</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>GIF帧率 (fps)</label>
                            <input type="number" id="gifFps" min="1" max="60" value="10" placeholder="仅GIF">
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-success" id="downloadBtn">下载图片</button>
                            <button class="btn btn-secondary" id="newImageBtn">上传新图片</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let originalImage = null;
        let currentImage = null;
        let selectedFormat = 'png';

        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const editorSection = document.getElementById('editorSection');
        const originalCanvas = document.getElementById('originalCanvas');
        const editedCanvas = document.getElementById('editedCanvas');
        const originalCtx = originalCanvas.getContext('2d');
        const editedCtx = editedCanvas.getContext('2d');

        uploadSection.addEventListener('click', () => fileInput.click());
        
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showNotification('请上传图片文件！', 'error');
                return;
            }

            const fileInfo = document.getElementById('fileInfo');
            fileInfo.innerHTML = `
                <p><strong>文件名:</strong> ${file.name}</p>
                <p><strong>类型:</strong> ${file.type}</p>
                <p><strong>大小:</strong> ${formatFileSize(file.size)}</p>
            `;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    currentImage = img;
                    
                    originalCanvas.width = img.width;
                    originalCanvas.height = img.height;
                    originalCtx.drawImage(img, 0, 0);
                    
                    editedCanvas.width = img.width;
                    editedCanvas.height = img.height;
                    editedCtx.drawImage(img, 0, 0);
                    
                    updateImageInfo();
                    setTimeout(updateCompressedSize, 100);
                    
                    const qualityHint = document.getElementById('qualityHint');
                    if (selectedFormat === 'png') {
                        qualityHint.textContent = 'PNG 是无损压缩格式，质量参数无效';
                        qualityHint.style.color = '#dc3545';
                    } else {
                        qualityHint.textContent = '适用于 JPEG 和 WebP 格式';
                        qualityHint.style.color = '#999';
                    }
                    
                    editorSection.classList.add('active');
                    uploadSection.style.display = 'none';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleReplaceImage(file) {
            if (!file.type.startsWith('image/')) {
                showNotification('请上传图片文件！', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    currentImage = img;
                    
                    originalCanvas.width = img.width;
                    originalCanvas.height = img.height;
                    originalCtx.drawImage(img, 0, 0);
                    
                    editedCanvas.width = img.width;
                    editedCanvas.height = img.height;
                    editedCtx.drawImage(img, 0, 0);
                    
                    updateImageInfo();
                    setTimeout(updateCompressedSize, 100);
                    
                    const qualityHint = document.getElementById('qualityHint');
                    if (selectedFormat === 'png') {
                        qualityHint.textContent = 'PNG 是无损压缩格式，质量参数无效';
                        qualityHint.style.color = '#dc3545';
                    } else {
                        qualityHint.textContent = '适用于 JPEG 和 WebP 格式';
                        qualityHint.style.color = '#999';
                    }
                    
                    showNotification('图片已替换！');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateCompressedSize() {
            if (!editedCanvas) return;
            
            const quality = parseInt(document.getElementById('qualitySlider').value) / 100;
            let mimeType = `image/${selectedFormat}`;
            
            if (selectedFormat === 'jpeg') {
                mimeType = 'image/jpeg';
            }
            
            let dataUrl;
            if (selectedFormat === 'png') {
                dataUrl = editedCanvas.toDataURL('image/png');
            } else {
                dataUrl = editedCanvas.toDataURL(mimeType, quality);
            }
            
            const base64Length = dataUrl.length - (dataUrl.indexOf(',') + 1);
            const padding = (base64Length % 4) ? 4 - (base64Length % 4) : 0;
            const binaryLength = Math.floor((base64Length * 3) / 4 - padding);
            
            const originalSize = editedCanvas.width * editedCanvas.height * 4;
            const ratio = originalSize > 0 ? ((originalSize - binaryLength) / originalSize * 100).toFixed(1) : 0;
            
            document.getElementById('compressedSize').textContent = formatFileSize(binaryLength);
            document.getElementById('compressionRatio').textContent = ratio > 0 ? `-${ratio}%` : ratio < 0 ? `+${Math.abs(ratio)}%` : '0%';
        }

        function updateImageInfo() {
            document.getElementById('originalInfo').innerHTML = `
                尺寸: ${originalCanvas.width} × ${originalCanvas.height} px
            `;
            document.getElementById('editedInfo').innerHTML = `
                尺寸: ${editedCanvas.width} × ${editedCanvas.height} px
            `;
        }

        document.getElementById('qualitySlider').addEventListener('input', (e) => {
            document.getElementById('qualityValue').textContent = e.target.value;
            updateCompressedSize();
        });

        document.getElementById('cropBtn').addEventListener('click', () => {
            const width = parseInt(document.getElementById('cropWidth').value);
            const height = parseInt(document.getElementById('cropHeight').value);
            const position = document.getElementById('cropPosition').value;

            if (!width || !height) {
                showNotification('请输入有效的裁剪尺寸！', 'error');
                return;
            }

            if (width > editedCanvas.width || height > editedCanvas.height) {
                showNotification('裁剪尺寸不能大于原图尺寸！', 'error');
                return;
            }

            let x, y;
            switch (position) {
                case 'top-left':
                    x = 0;
                    y = 0;
                    break;
                case 'top-right':
                    x = editedCanvas.width - width;
                    y = 0;
                    break;
                case 'bottom-left':
                    x = 0;
                    y = editedCanvas.height - height;
                    break;
                case 'bottom-right':
                    x = editedCanvas.width - width;
                    y = editedCanvas.height - height;
                    break;
                case 'center':
                default:
                    x = Math.floor((editedCanvas.width - width) / 2);
                    y = Math.floor((editedCanvas.height - height) / 2);
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(editedCanvas, x, y, width, height, 0, 0, width, height);

            editedCanvas.width = width;
            editedCanvas.height = height;
            editedCtx.drawImage(tempCanvas, 0, 0);

            updateImageInfo();
            updateCompressedSize();
            showNotification('裁剪完成！');
        });

        document.getElementById('resetCropBtn').addEventListener('click', () => {
            editedCanvas.width = originalCanvas.width;
            editedCanvas.height = originalCanvas.height;
            editedCtx.drawImage(originalCanvas, 0, 0);
            updateImageInfo();
            showNotification('已重置为原图！');
        });

        document.getElementById('compressBtn').addEventListener('click', () => {
            const quality = parseInt(document.getElementById('qualitySlider').value) / 100;
            const maxWidth = parseInt(document.getElementById('maxWidth').value);
            const maxHeight = parseInt(document.getElementById('maxHeight').value);

            let newWidth = editedCanvas.width;
            let newHeight = editedCanvas.height;

            if (maxWidth && newWidth > maxWidth) {
                const ratio = maxWidth / newWidth;
                newWidth = maxWidth;
                newHeight = newHeight * ratio;
            }

            if (maxHeight && newHeight > maxHeight) {
                const ratio = maxHeight / newHeight;
                newHeight = maxHeight;
                newWidth = newWidth * ratio;
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newWidth;
            tempCanvas.height = newHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(editedCanvas, 0, 0, newWidth, newHeight);

            editedCanvas.width = newWidth;
            editedCanvas.height = newHeight;
            editedCtx.drawImage(tempCanvas, 0, 0);

            updateImageInfo();
            updateCompressedSize();
            showNotification('压缩完成！');
        });

        document.getElementById('resetCompressBtn').addEventListener('click', () => {
            editedCanvas.width = originalCanvas.width;
            editedCanvas.height = originalCanvas.height;
            editedCtx.drawImage(originalCanvas, 0, 0);
            updateImageInfo();
            showNotification('已重置为原图！');
        });

        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedFormat = btn.dataset.format;
                
                const qualityHint = document.getElementById('qualityHint');
                if (selectedFormat === 'png') {
                    qualityHint.textContent = 'PNG 是无损压缩格式，质量参数无效';
                    qualityHint.style.color = '#dc3545';
                } else {
                    qualityHint.textContent = '适用于 JPEG 和 WebP 格式';
                    qualityHint.style.color = '#999';
                }
                
                updateCompressedSize();
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const quality = parseInt(document.getElementById('qualitySlider').value) / 100;
            let mimeType = `image/${selectedFormat}`;
            
            if (selectedFormat === 'jpeg') {
                mimeType = 'image/jpeg';
            }

            const link = document.createElement('a');
            link.download = `edited_image.${selectedFormat}`;
            link.href = editedCanvas.toDataURL(mimeType, quality);
            link.click();
            
            showNotification('图片下载开始！');
        });

        document.getElementById('newImageBtn').addEventListener('click', () => {
            editorSection.classList.remove('active');
            uploadSection.style.display = 'block';
            fileInput.value = '';
            originalImage = null;
            currentImage = null;
            document.getElementById('fileInfo').innerHTML = '';
        });

        const originalPreview = document.getElementById('originalPreview');
        
        originalPreview.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                if (e.target.files.length > 0) {
                    handleReplaceImage(e.target.files[0]);
                }
            };
            input.click();
        });

        originalPreview.addEventListener('dragover', (e) => {
            e.preventDefault();
            originalPreview.classList.add('drag-over');
        });

        originalPreview.addEventListener('dragleave', () => {
            originalPreview.classList.remove('drag-over');
        });

        originalPreview.addEventListener('drop', (e) => {
            e.preventDefault();
            originalPreview.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleReplaceImage(files[0]);
            }
        });

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            
            if (type === 'error') {
                notification.style.background = 'rgba(255, 0, 0, 0.9)';
                notification.style.border = '2px solid #ff0000';
                notification.style.boxShadow = '0 0 20px rgba(255, 0, 0, 0.8)';
            } else {
                notification.style.background = 'rgba(0, 255, 0, 0.9)';
                notification.style.border = '2px solid #00ff00';
                notification.style.boxShadow = '0 0 20px rgba(0, 255, 0, 0.8)';
            }
            
            notification.style.color = '#fff';
            notification.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.8)';
            notification.style.padding = '15px 25px';
            notification.style.borderRadius = '10px';
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.zIndex = '10000';
            notification.style.animation = 'notificationSlide 0.5s ease-out';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'notificationSlideOut 0.5s ease-in';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes notificationSlide {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes notificationSlideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener('mousemove', (e) => {
            const cursor = document.createElement('div');
            cursor.className = 'cyber-cursor';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            document.body.appendChild(cursor);
            
            setTimeout(() => cursor.remove(), 500);
        });

        const cursorStyle = document.createElement('style');
        cursorStyle.textContent = `
            .cyber-cursor {
                position: fixed;
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 0, 255, 0.5);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                animation: cursorFade 0.5s ease-out forwards;
            }
            @keyframes cursorFade {
                0% {
                    transform: scale(1);
                    opacity: 1;
                }
                100% {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(cursorStyle);
    </script>
</body>
</html>
